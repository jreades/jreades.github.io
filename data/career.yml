# Hand-maintained roles, education, service and memberships; the source of truth.
# scripts/build_career.py overlays data/orcid-career.json: ORCID entries that match one
# here (same organisation and role) are dropped and any date/role differences reported;
# complete ORCID entries with no match are added. Omit `end` for a current post.
# `org` is matched against ORCID's organisation name, so use the full name.

