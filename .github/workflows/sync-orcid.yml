name: Sync ORCID

# Opens a PR when new works appear on ORCID. It never touches main directly and
# never deploys: merging the PR triggers publish.yml as usual.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'bibtexparser<2' pyyaml
      - run: python scripts/sync_orcid.py
      - run: python scripts/sync_orcid_career.py
      - run: python scripts/build_career.py --report > career-report.md
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/orcid.bib data/orcid-career.json)" ]; then
            echo "No changes on ORCID."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B orcid-sync
          git add data/orcid.bib data/orcid-career.json
          git commit -m "Sync publications and career from ORCID"
          git push --force origin orcid-sync
          {
            echo "Generated by \`scripts/sync_orcid.py\` and \`scripts/sync_orcid_career.py\`. Merging redeploys the site."
            echo
            echo "- Publications: review \`data/orcid.bib\`. To correct an entry, move it into \`pubs.bib\`/\`talks.bib\`; to hide one, add its put-code or DOI to \`data/orcid-ignore.txt\`."
            echo "- Roles, education, service: \`data/career.yml\` wins over \`data/orcid-career.json\`. Differences found:"
            echo
            cat career-report.md
          } > pr-body.md
          if [ -z "$(gh pr list --head orcid-sync --state open --json number --jq '.[]')" ]; then
            gh pr create --base main --head orcid-sync --title "Updates from ORCID" --body-file pr-body.md
          else
            gh pr edit orcid-sync --body-file pr-body.md
          fi
