<script>
// A random duotone photo for every page's banner; fall back to the drawn ridgeline.
(function () {
  var root = document.documentElement;
  if (!document.querySelector('.hero')) {
    var slim = document.createElement('div');
    slim.className = 'hero hero-slim';
    slim.innerHTML = '<div class="g"><div class="hero-window" style="grid-column:1 / -1" role="img" aria-label="Landscape photograph"></div></div>';
    var c = document.getElementById('quarto-content');
    c.parentNode.insertBefore(slim, c);
  }
  function set(url) { root.style.setProperty('--hero', 'url(' + url + ')'); }
  fetch('/img/duotone/images.json')
    .then(function (r) { return r.json(); })
    .then(function (l) { set('/img/duotone/' + l[Math.floor(Math.random() * l.length)].file); })
    .catch(function () { set('/img/ridgeline.svg'); });
})();
</script>
